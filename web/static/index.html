<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ShadowSnipe Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo-mark" aria-hidden="true">☠</div>
        <div>
          <div class="brand-name">SHADOW_SNIPE</div>
          <div class="brand-sub">EXECUTION TERMINAL</div>
        </div>
      </div>
      <div class="topbar-right">
        <button id="themeToggle" class="icon-btn" type="button" title="Toggle theme">◐</button>
        <span id="statusPill" class="pill offline">CONNECTING</span>
      </div>
    </header>

    <main id="main">
      <section class="card hero">
        <div class="label">TOTAL PORTFOLIO BALANCE</div>
        <div class="balance-row">
          <span id="balSol" class="balance">—</span>
          <span class="unit">SOL</span>
        </div>
        <div id="balUsd" class="usd">≈ $— USD</div>
        <div class="hint">Phase 3 shell · live balances in Phase 1</div>
      </section>

      <section class="card">
        <div class="row-between">
          <div class="label">TOTAL PNL</div>
          <div class="chip-row">
            <button class="chip active" data-range="24h">24h</button>
            <button class="chip" data-range="7d">7d</button>
            <button class="chip" data-range="30d">30d</button>
          </div>
        </div>
        <div id="pnlValue" class="pnl">$—</div>
        <div class="sparkline" aria-hidden="true"></div>
      </section>

      <section class="actions">
        <button class="btn primary" id="btnBuy" type="button" disabled>BUY</button>
        <button class="btn ghost" id="btnSell" type="button" disabled>SELL</button>
      </section>

      <section id="gateCard" class="card gate hidden">
        <div class="gate-title">🔒 License required</div>
        <p>Activate ShadowSnipe in the bot to unlock the terminal.</p>
        <p class="muted">Referral unlocks will appear here later.</p>
      </section>

      <section id="userCard" class="card muted-card">
        <div class="label">SESSION</div>
        <div id="userLine">Authenticating…</div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="terminal">Terminal</button>
      <button class="tab" data-tab="positions">Positions</button>
      <button class="tab" data-tab="wallets">Wallets</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
